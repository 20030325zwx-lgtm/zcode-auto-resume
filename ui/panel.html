<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>自动续跑</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; --bg:#f8f9fa; --card:#fff; --text:#26312e; --muted:#738079; --line:#e2e7e4; --accent:#16765c; --soft:#eaf4ef; --error:#b3483b; }
    @media(prefers-color-scheme:dark) { :root:not([data-theme="light"]) { --bg:#161817; --card:#1f2220; --text:#e3e8e5; --muted:#9ca8a0; --line:#343b36; --accent:#82c8ab; --soft:#263d32; --error:#f1a195; } }
    :root[data-theme="dark"] { color-scheme:dark; --bg:#161817; --card:#1f2220; --text:#e3e8e5; --muted:#9ca8a0; --line:#343b36; --accent:#82c8ab; --soft:#263d32; --error:#f1a195; }
    :root[data-theme="light"] { color-scheme:light; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-size:13px; line-height:1.6; }
    main { max-width:640px; margin:0 auto; padding:20px 16px; }
    header,.status-line,.row-head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    h1 { font-size:17px; margin:0; font-weight:650; }
    h2 { font-size:13px; margin:0; font-weight:600; }
    p { margin:0; }
    .muted,time,.meta { color:var(--muted); font-size:12px; }
    .card { margin-top:16px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
    .status { font-size:16px; font-weight:600; display:flex; align-items:center; gap:8px; }
    .dot { width:7px; height:7px; border-radius:50%; background:var(--muted); }
    .dot.active { background:var(--accent); box-shadow:0 0 0 3px var(--soft); }
    button { font:inherit; cursor:pointer; border:1px solid var(--line); border-radius:7px; padding:7px 12px; background:var(--card); color:var(--text); }
    button.primary { background:var(--accent); color:var(--bg); border-color:transparent; font-weight:600; }
    button:disabled { opacity:.5; cursor:default; }
    button:focus-visible,summary:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
    .refresh { border:0; padding:3px 0; color:var(--muted); background:none; }
    .meta { margin-top:12px; }
    .numbers { display:flex; gap:18px; margin-top:14px; padding-top:12px; border-top:1px solid var(--line); color:var(--muted); font-size:12px; }
    .numbers b { color:var(--text); font-size:15px; margin-right:4px; }
    #alert { margin-top:12px; color:var(--error); overflow-wrap:anywhere; }
    section { margin-top:24px; }
    .row { padding:12px 0; border-bottom:1px solid var(--line); overflow-wrap:anywhere; }
    .row:last-child { border:0; }
    .row-title { font-weight:500; min-width:0; }
    .badge { color:var(--accent); white-space:nowrap; font-size:11px; }
    .badge.failed { color:var(--error); }
    .row p { font-size:12px; color:var(--muted); margin-top:3px; }
    .row time { display:block; margin-top:3px; font-size:11px; }
    .empty { color:var(--muted); padding:14px 0; font-size:12px; }
    details { margin-top:18px; border-top:1px solid var(--line); padding-top:14px; }
    summary { cursor:pointer; color:var(--muted); font-size:12px; }
    .rules { margin-top:20px; color:var(--muted); font-size:11px; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
  <main>
    <header><h1>自动续跑</h1><button class="refresh" id="refresh">刷新</button></header>
    <div class="card">
      <div class="status-line"><div class="status"><span class="dot" id="dot"></span><span id="status" role="status">连接中</span></div><button class="primary" id="toggle" disabled>开始检测</button></div>
      <p class="meta" id="checked">正在连接监控服务…</p>
      <div class="numbers"><span><b id="count">—</b>个会话</span><span><b id="attempts">—</b>次今日尝试</span></div>
      <p id="alert" role="alert" hidden></p>
    </div>
    <section><h2>最近续跑</h2><div id="events"><p class="empty">暂无记录</p></div></section>
    <details id="sessions-details"><summary>查看本轮会话</summary><div id="sessions"></div></details>
    <details><summary>查看巡检历史</summary><div id="checks"></div></details>
    <p class="rules">每 2 分钟检查最近 20 分钟活跃的会话 · 每个会话每天最多尝试 100 次<br>此开关控制所有会话。停止时，正在提交的指令会先处理完。</p>
  </main>
  <script type="module">/* APP_SCRIPT */</script>
</body>
</html>
