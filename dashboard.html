<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZCode 任务监控</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f7f8f8; color: #202b31; font-size: 14px; }
    button, input { font: inherit; }
    .topbar { background: #fff; border-bottom: 1px solid #dce3e4; }
    .topbar-inner, main { max-width: 1180px; margin: auto; padding: 0 28px; }
    .topbar-inner { min-height: 75px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .mark { width: 32px; height: 32px; display: grid; place-items: center; background: #1b7c69; color: #fff; font-weight: 700; font-size: 17px; border-radius: 5px; flex: none; }
    .brand h1 { font-size: 17px; margin: 0; font-weight: 680; }
    .brand small { color: #68777e; font-size: 12px; display: block; margin-top: 2px; }
    .controls { display: flex; align-items: center; gap: 16px; white-space: nowrap; }
    .controls label { display: flex; gap: 7px; align-items: center; color: #536269; cursor: pointer; }
    .controls input { accent-color: #1b7c69; }
    button { background: #fff; border: 1px solid #bccacc; border-radius: 5px; padding: 7px 12px; color: #26383d; cursor: pointer; }
    button:hover { background: #edf4f2; border-color: #82aa9f; }
    button:disabled { cursor: default; opacity: .48; background: #f5f7f7; border-color: #dce3e4; }
    .start-button { color: #fff; background: #1b7c69; border-color: #1b7c69; }
    .start-button:hover:not(:disabled) { color: #fff; background: #126b59; border-color: #126b59; }
    button:focus-visible, input:focus-visible { outline: 2px solid #277e70; outline-offset: 2px; }
    main { padding-top: 27px; padding-bottom: 56px; }
    .summary { display: grid; grid-template-columns: minmax(250px, 1.5fr) repeat(3, minmax(130px, 1fr)); border-top: 1px solid #dce3e4; border-bottom: 1px solid #dce3e4; background: #fff; }
    .summary > div { padding: 18px 22px; border-right: 1px solid #e5ebec; min-height: 88px; }
    .summary > div:last-child { border-right: 0; }
    .label { color: #64747b; font-size: 12px; margin-bottom: 9px; }
    .value { font-size: 24px; font-weight: 680; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .value.small { font-size: 16px; line-height: 1.45; }
    .status-line { display: flex; align-items: center; gap: 8px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #9aa7aa; flex: none; }
    .dot.live { background: #198767; box-shadow: 0 0 0 3px #d9efe5; }
    .dot.stale { background: #d49120; box-shadow: 0 0 0 3px #fff0d4; }
    .dot.offline { background: #c4514d; box-shadow: 0 0 0 3px #fae3e1; }
    .subvalue { color: #68777e; font-size: 12px; margin-top: 7px; font-variant-numeric: tabular-nums; }
    .section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 15px; margin: 34px 0 12px; }
    h2 { font-size: 16px; margin: 0; font-weight: 680; }
    .section-meta { color: #68777e; font-size: 12px; }
    .table-wrap { overflow-x: auto; background: #fff; border-top: 1px solid #dce3e4; border-bottom: 1px solid #dce3e4; }
    table { border-collapse: collapse; width: 100%; table-layout: fixed; }
    th, td { padding: 12px 13px; border-bottom: 1px solid #ecf0f0; text-align: left; vertical-align: top; overflow-wrap: anywhere; }
    th { font-size: 11px; font-weight: 650; color: #627178; background: #fbfcfc; }
    tr:last-child td { border-bottom: 0; }
    th:nth-child(1) { width: 32%; } th:nth-child(2) { width: 17%; } th:nth-child(3) { width: 13%; } th:nth-child(4) { width: 29%; } th:nth-child(5) { width: 9%; }
    .task-title { font-weight: 600; line-height: 1.45; }
    .task-id { color: #74828a; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; margin-top: 4px; word-break: break-all; }
    .muted { color: #68777e; }
    .decision { font-weight: 600; }
    .decision.sent, .decision.ready, .decision.running { color: #147760; } .decision.waiting, .decision.cooldown, .decision.recent { color: #a66a08; }
    .decision.skipped, .decision.limit, .decision.failed { color: #ad4e47; }
    .reason { font-size: 12px; color: #64747b; margin-top: 4px; line-height: 1.45; }
    .empty { padding: 28px 14px; color: #68777e; text-align: center; }
    .lower { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 34px; }
    .list { background: #fff; border-top: 1px solid #dce3e4; border-bottom: 1px solid #dce3e4; min-height: 70px; }
    .list-row { padding: 12px 13px; border-bottom: 1px solid #ecf0f0; display: flex; justify-content: space-between; gap: 16px; line-height: 1.5; }
    .list-row:last-child { border: 0; }
    .list-row span { min-width: 0; overflow-wrap: anywhere; }
    .list-row strong { font-weight: 600; }
    .list-row time { color: #68777e; font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 12px; }
    .alert { margin-top: 18px; border-left: 3px solid #c4514d; padding: 9px 13px; background: #fff0ee; color: #983b37; display: none; }
    @media (max-width: 800px) {
      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .summary > div:nth-child(2) { border-right: 0; }
      .summary > div:nth-child(-n+2) { border-bottom: 1px solid #e5ebec; }
      .lower { grid-template-columns: 1fr; gap: 0; }
    }
    @media (max-width: 620px) {
      .topbar-inner, main { padding-left: 16px; padding-right: 16px; }
      .topbar-inner { flex-wrap: wrap; padding-top: 13px; padding-bottom: 13px; }
      .controls { width: 100%; justify-content: space-between; }
      .summary > div { padding: 14px; min-height: 82px; }
      .value { font-size: 20px; }
      .value.small { font-size: 14px; }
      table, tbody, tr, td { display: block; width: 100%; }
      thead { display: none; }
      tr { padding: 10px 13px; border-bottom: 1px solid #e5ebec; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
      tr:last-child { border: 0; }
      td { border: 0; padding: 0; }
      td:first-child, td:nth-child(4) { grid-column: 1 / -1; }
      td::before { content: attr(data-label); display: block; color: #68777e; font-size: 11px; margin-bottom: 3px; }
    }
  </style>
</head>
<body>
  <header class="topbar"><div class="topbar-inner">
    <div class="brand"><div class="mark">Z</div><div><h1>任务监控</h1><small>ZCode 自动续跑</small></div></div>
    <div class="controls"><button id="start" class="start-button" type="button" disabled>开始检测</button><button id="stop" type="button" disabled>停止</button><label><input id="auto-refresh" type="checkbox" checked>自动刷新</label><button id="refresh" type="button">刷新</button></div>
  </div></header>
  <main>
    <section class="summary" aria-label="监控概况">
      <div><div class="label">监控状态</div><div class="value small status-line"><span id="dot" class="dot"></span><span id="monitor-state">连接中</span></div><div id="process" class="subvalue">正在读取状态</div></div>
      <div><div class="label">上次巡检</div><div id="checked" class="value small">--</div><div id="next" class="subvalue">--</div></div>
      <div><div class="label">本轮检查会话</div><div id="scanned" class="value">--</div><div class="subvalue">最近 20 分钟</div></div>
      <div><div class="label">今日尝试次数</div><div id="attempts" class="value">--</div><div class="subvalue">每个任务上限 100 次</div></div>
    </section>
    <div id="alert" class="alert" role="alert"></div>
    <section><div class="section-head"><h2>本轮检查的会话</h2><span id="session-meta" class="section-meta">--</span></div>
      <div class="table-wrap"><table><thead><tr><th>会话</th><th>最近活动</th><th>任务状态</th><th>巡检结果</th><th>今日次数</th></tr></thead><tbody id="sessions"></tbody></table><div id="sessions-empty" class="empty" hidden>最近 20 分钟没有需要检查的会话</div></div>
    </section>
    <div class="lower">
      <section><div class="section-head"><h2>续跑记录</h2><span class="section-meta">最近 50 条</span></div><div id="events" class="list"></div></section>
      <section><div class="section-head"><h2>巡检记录</h2><span class="section-meta">最近 30 轮</span></div><div id="checks" class="list"></div></section>
    </div>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const labels = { normal: "正常", running: "运行中", recent: "最近活跃", index_completed: "索引已完成", waiting: "等待", skipped: "跳过", ready: "待续跑", sent: "已确认送达", failed: "发送失败", handled: "已处理", cooldown: "冷却中", limit: "达上限" };
    const taskStatusLabels = { running: "运行中", recent: "最近活跃", index_completed: "索引已完成", completed: "索引已完成", error: "错误", idle: "空闲" };
    const time = (value) => value ? new Date(value * 1000).toLocaleString("zh-CN", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false }) : "--";
    function cell(row, label, content) {
      const td = document.createElement("td"); td.dataset.label = label;
      if (typeof content === "string") td.textContent = content; else td.append(content);
      row.append(td);
    }
    function line(primary, secondary, className) {
      const wrap = document.createElement("div");
      const main = document.createElement("div"); main.className = className || ""; main.textContent = primary; wrap.append(main);
      if (secondary) { const sub = document.createElement("div"); sub.className = className.startsWith("task-") ? "task-id" : "reason"; sub.textContent = secondary; wrap.append(sub); }
      return wrap;
    }
    function renderList(id, rows, makeText) {
      const root = $(id); root.replaceChildren();
      if (!rows.length) { const empty = document.createElement("div"); empty.className = "empty"; empty.textContent = "暂无记录"; root.append(empty); return; }
      rows.forEach((item) => { const row = document.createElement("div"); row.className = "list-row"; const text = document.createElement("span"); text.textContent = makeText(item); const date = document.createElement("time"); date.textContent = time(item.at); row.append(text, date); root.append(row); });
    }
    function render(data) {
      const age = Date.now() / 1000 - (data.checked_at || 0);
      const live = data.checked_at && age < (data.interval_seconds || 120) * 2 + 30;
      const monitoring = data.monitoring === true;
      $("dot").className = "dot " + (monitoring ? (live || !data.checked_at ? "live" : "stale") : "");
      $("monitor-state").textContent = monitoring ? (live || !data.checked_at ? "检测中" : "巡检已延迟") : "已停止";
      $("process").textContent = data.pid ? "页面进程 " + data.pid + (monitoring ? " · 每 2 分钟巡检" : " · 未巡检") : "等待页面服务";
      $("start").disabled = monitoring;
      $("stop").disabled = !monitoring;
      $("checked").textContent = time(data.checked_at);
      $("next").textContent = monitoring ? "预计下次：" + time(data.next_check_at) : "检测已停止";
      const sessions = data.sessions || [];
      $("scanned").textContent = sessions.length;
      $("attempts").textContent = data.attempts_today_total || 0;
      $("session-meta").textContent = "检查于 " + time(data.checked_at);
      const tbody = $("sessions"); tbody.replaceChildren();
      sessions.forEach((item) => {
        const row = document.createElement("tr");
        cell(row, "会话", line(item.title, item.id, "task-title"));
        cell(row, "最近活动", time(item.updated_at));
        cell(row, "任务状态", taskStatusLabels[item.task_status] || item.task_status);
        cell(row, "巡检结果", line(labels[item.decision] || item.decision, item.reason, "decision " + item.decision));
        cell(row, "今日次数", String(item.attempts_today || 0));
        tbody.append(row);
      });
      $("sessions-empty").hidden = sessions.length > 0;
      renderList("events", data.events || [], (item) => item.title + " · " + item.detail);
      renderList("checks", data.checks || [], (item) => "检查 " + item.scanned + " 个会话，续跑 " + item.resumed + " 个");
      $("alert").style.display = data.error ? "block" : "none";
      $("alert").textContent = data.error || "";
    }
    async function refresh() {
      try {
        const response = await fetch("/api/status", { cache: "no-store" });
        if (!response.ok) throw new Error("HTTP " + response.status);
        render(await response.json());
      } catch (error) {
        $("dot").className = "dot offline";
        $("monitor-state").textContent = "无法连接监控进程";
        $("start").disabled = true;
        $("stop").disabled = true;
        $("alert").style.display = "block";
        $("alert").textContent = String(error);
      }
    }
    async function setMonitoring(action) {
      $("start").disabled = true;
      $("stop").disabled = true;
      try {
        const response = await fetch("/api/" + action, { method: "POST", headers: { "X-ZCode-Control": "1" } });
        if (!response.ok) throw new Error("HTTP " + response.status);
        await refresh();
      } catch (error) {
        $("alert").style.display = "block";
        $("alert").textContent = "切换检测状态失败：" + String(error);
        await refresh();
      }
    }
    $("start").addEventListener("click", () => setMonitoring("start"));
    $("stop").addEventListener("click", () => setMonitoring("stop"));
    $("refresh").addEventListener("click", refresh);
    setInterval(() => { if ($("auto-refresh").checked) refresh(); }, 5000);
    refresh();
  </script>
</body>
</html>
